<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Background Container -->
  <rect width="64" height="64" rx="16" fill="#1e293b"/>
  <!-- Subtle Gradient Glow -->
  <circle cx="32" cy="32" r="28" fill="url(#brandGlow)" opacity="0.15"/>
  
  <!-- Freight Truck Icon -->
  <g transform="translate(10, 14)" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Trailer Body -->
    <rect x="2" y="4" width="22" height="20" rx="2" fill="#0f172a" stroke="#38bdf8"/>
    <!-- Cab Body -->
    <path d="M24 10h9l5 7v7h-14V10z" fill="#0284c7" stroke="#38bdf8"/>
    <!-- Cab Window -->
    <path d="M26 12h6l3 5h-9v-5z" fill="#38bdf8" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Wheels -->
    <circle cx="8" cy="26" r="3.5" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="18" cy="26" r="3.5" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="32" cy="26" r="3.5" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  </g>
  
  <!-- HOS Active Green Status Indicator Badge -->
  <circle cx="50" cy="14" r="5" fill="#10b981" stroke="#0f172a" stroke-width="2"/>

  <defs>
    <radialGradient id="brandGlow" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>